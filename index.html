.hero.sm .brandlogo{width:76px;height:76px;margin-bottom:6px}
.thu{font-family:'LaylaThuluth','Segoe UI',Tahoma,sans-serif}
.goldtext{background:linear-gradient(180deg,#fff7d6 5%,#f6d365 45%,#d97706 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.appframe{position:fixed;inset:0;z-index:55;pointer-events:none;border:6px solid transparent;border-image:linear-gradient(160deg,#c9a227,#4338ca 38%,#0d9488 72%,#c9a227) 1}
.appframe .afc{position:absolute;width:64px;height:64px;color:#b98a1e;opacity:.85}
.appframe .afc.tr{top:-3px;right:-3px}
.appframe .afc.tl{top:-3px;left:-3px;transform:scaleX(-1)}
.appframe .afc.br{bottom:-3px;right:-3px;transform:scaleY(-1)}
.appframe .afc.bl{bottom:-3px;left:-3px;transform:scale(-1)}
.hero .hero-circuit{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
.hero .thu-title{font-weight:800;line-height:1.5;padding:0 6px;margin-bottom:2px}
.hero .thu-name{line-height:1.6}
.hero .thu-div{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px auto 8px}
.hero .thu-div span{height:1.5px;width:74px;background:linear-gradient(90deg,transparent,#f6d365)}
.hero .thu-div span:last-child{background:linear-gradient(90deg,#f6d365,transparent)}
.hero .thu-div svg{color:#f6d365}
.hero .spark-deco{position:absolute;color:rgba(255,255,255,.5);pointer-events:none}
.smartstrip{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1e1b4b,#4338ca);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.smartstrip .sic2{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fde68a}
.smartstrip b{font-size:15px;display:block;margin-bottom:2px}
.smartstrip span{font-size:12.5px;opacity:.85}
.toolout{direction:ltr;text-align:left;background:#0f172a;color:#a5f3fc;font-size:13px;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;margin-top:10px;font-family:Consolas,monospace}
.toolprev{height:64px;border-radius:12px;border:1.5px solid var(--line);margin-top:10px}
.swatchrow{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2.5px var(--pri)}
.tsprev{background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 55%,#0d9488 100%);color:#fff;border-radius:14px;padding:20px 12px;text-align:center;margin-bottom:12px}
.tsprev .tp1{font-weight:800;line-height:1.5}
.tsprev .tp2{color:#fde68a;font-weight:800;line-height:1.6}
input[type=range]{width:100%}
.mode-seg{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;margin-bottom:12px}
.mode-seg button{flex:1;padding:10px;background:#fff;color:var(--mut);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mode-seg button.on{background:var(--pri);color:#fff}
.voverlay{position:fixed;inset:0;background:rgba(15,23,42,.78);z-index:80;display:flex;flex-direction:column;padding:16px 12px}
.vbar{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:15px;padding:0 4px 10px}
.vbar .vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar a{color:#93c5fd;font-size:13px;text-decoration:none;white-space:nowrap}
.vbar button{background:#fff;color:#131c33;border-radius:10px;padding:7px 16px;font-weight:800;font-size:14px}
.vframe{flex:1;background:#fff;border-radius:14px;overflow:hidden}
.vframe iframe{width:100%;height:100%;border:0}
.ytic{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 55%,#0d9488 100%);color:#fff;border-radius:0 0 30px 30px;padding:40px 20px 30px;text-align:center}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.14) 0 2px,transparent 2.5px),radial-gradient(circle at 85% 30%,rgba(255,255,255,.1) 0 2px,transparent 2.5px),radial-gradient(circle at 70% 85%,rgba(255,255,255,.12) 0 2px,transparent 2.5px),radial-gradient(circle at 30% 80%,rgba(255,255,255,.08) 0 2px,transparent 2.5px);background-size:120px 120px,150px 150px,170px 170px,140px 140px}
.hero::after{content:'</>';position:absolute;left:-8px;bottom:-30px;font-size:120px;font-weight:800;color:rgba(255,255,255,.06);direction:ltr;letter-spacing:-6px}
.hero>*{position:relative;z-index:1}
.hero .logo{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25)}
.hero h1{font-size:26px;font-weight:800;margin-bottom:8px;letter-spacing:-.2px}
.hero .tname{font-size:19px;font-weight:800;color:#fde68a;margin-bottom:3px}
.hero .trole{font-size:14px;opacity:.92}
.hero .sub{font-size:14px;opacity:.85;margin-top:8px}
.hero .pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hero .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.hero.sm{padding:26px 20px 20px}
.hero.sm h1{font-size:21px}
/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border-radius:13px;padding:13px 18px;font-size:16px;font-weight:700;width:100%;box-shadow:0 4px 14px rgba(79,70,229,.3);transition:transform .06s}
.btn:active{transform:scale(.985)}
.btn.sec{background:#e7ebf7;color:var(--ink);box-shadow:none}
.btn.dan{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(220,38,38,.25)}
.btn.sm{padding:8px 13px;font-size:14px;width:auto;border-radius:10px;box-shadow:none}
.btn.out{background:#fff;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 14px rgba(217,119,6,.3)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;color:var(--pri);font-size:14px;font-weight:700;padding:4px}
/* ---------- role cards ---------- */
.rolecard{display:flex;align-items:center;gap:14px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:14px;box-shadow:var(--sh);width:100%;transition:transform .08s,box-shadow .08s}
.rolecard:active{transform:scale(.98)}
.rolecard .ric{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.rolecard .ric.st{background:linear-gradient(135deg,#0d9488,#0f766e)}
.rolecard .ric.te{background:linear-gradient(135deg,#4f46e5,#4338ca)}
.rolecard h3{font-size:18px;margin-bottom:4px}
.rolecard p{font-size:13.5px;color:var(--mut);line-height:1.6}
.rolecard .go{margin-inline-start:auto;color:var(--pri)}
/* ---------- feature strip ---------- */
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh)}
.feat .fic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feat b{font-size:13.5px;display:block}
.feat span{font-size:12px;color:var(--mut)}
/* ---------- forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fbfcff;color:var(--ink);transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.14);background:#fff}
.hint{font-size:13px;color:var(--mut);margin-top:5px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
/* ---------- right-side navigation rail ---------- */
.wrap.shellwrap{max-width:920px}
.shell{display:flex;gap:14px;align-items:flex-start}
.tabs.side{flex-direction:column;overflow:visible;padding:4px 0 12px;width:154px;flex:none;position:sticky;top:12px;gap:8px}
.tabs.side .tab{border-radius:14px;padding:11px 13px;font-size:15px;justify-content:flex-start;width:100%;white-space:normal}
.shbody{flex:1;min-width:0}
.shbody input,.shbody select,.shbody textarea{min-width:0;max-width:100%}
@media(max-width:600px){
 .shell{gap:8px}
 .shbody .row{flex-wrap:wrap}
 .shbody .frow{flex-wrap:wrap}
 .shbody .frow .grow{flex:1 1 140px;min-width:0}
 .shbody .row .grow{flex:1 1 120px}
 .tabs.side{width:76px;gap:6px}
 .tabs.side .tab{flex-direction:column;justify-content:center;gap:3px;padding:9px 3px;font-size:11.5px;line-height:1.25;text-align:center;border-radius:12px}
}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;background:#fff;border:1.5px solid var(--line);color:var(--mut);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tab.on{background:linear-gradient(135deg,var(--pri),var(--pri-d));border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:#f1f4fb;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mut);font-weight:600}
.chip.on{background:#e0e7ff;border-color:var(--pri);color:var(--pri-d);font-weight:800}
/* ---------- tables & lists ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:12.5px;font-weight:700}
tr:last-child td{border-bottom:0}
.mut{color:var(--mut);font-size:14px}
.big{font-size:26px;font-weight:800;line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 8px;text-align:center;box-shadow:var(--sh)}
.stat .sic{width:38px;height:38px;margin:0 auto 8px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.stat .lbl{font-size:12px;color:var(--mut);margin-top:3px;font-weight:600}
.toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:#131c33;color:#fff;padding:13px 22px;border-radius:13px;font-size:15px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.toast.err{background:var(--dan)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.seg button{flex:1;padding:9px 4px;background:#fff;color:var(--mut);font-size:14px;font-weight:700;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.p.on{background:var(--ok);color:#fff}
.seg button.l.on{background:var(--warn);color:#fff}
.seg button.a.on{background:var(--dan);color:#fff}
.frow{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#e0e7ff,#c7d2fe);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex-shrink:0}
.fileic{width:64px;height:64px;border-radius:12px;background:#eef1f8;color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 0 4px}
.topbar h2{font-size:19px}
.center{text-align:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.empty .eic{width:52px;height:52px;margin:0 auto 10px;border-radius:16px;background:#eef1f8;color:#9aa7c7;display:flex;align-items:center;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800}
.badge.g{background:#dcfce7;color:#15803d}.badge.y{background:#fef3c7;color:#b45309}.badge.r{background:#fee2e2;color:#b91c1c}.badge.b{background:#e0e7ff;color:#4338ca}
.prog{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pri));border-radius:99px;transition:width .25s}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:16.5px;margin-bottom:12px}
.sec-title .tic{width:30px;height:30px;border-radius:9px;background:#e0e7ff;color:var(--pri-d);display:flex;align-items:center;justify-content:center}
/* ---------- footer ---------- */
.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:20px 10px 8px;line-height:1.9}
.foot b{color:var(--pri-d)}
.foot .fline{width:60px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--teal));margin:0 auto 10px}
/* ---------- donut & chart ---------- */
.donut{display:flex;align-items:center;gap:16px;justify-content:center}
.chart{width:100%;height:auto}
/* ---------- print report ---------- */
.printdoc{background:#fff;color:#111;max-width:700px;margin:0 auto;padding:24px;font-size:14px;line-height:1.7}
.printdoc .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double #4338ca;padding-bottom:12px;margin-bottom:16px}
.printdoc .ph h1{font-size:20px;color:#1e1b4b}
.printdoc .ph .ps{font-size:13px;color:#555}
.printdoc h2{font-size:16px;background:#eef1fb;border-right:4px solid #4338ca;padding:6px 10px;margin:16px 0 8px;color:#1e1b4b}
/* ---------- exams & certificates ---------- */
.opt{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;transition:.15s;background:#fff;font-size:15px}
.opt:hover{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:#eef1fb;font-weight:800}
.opt input{margin-inline-end:8px}
.timer{position:sticky;top:8px;z-index:5;display:flex;justify-content:center;margin-bottom:10px}
.timer span{background:#1e1b4b;color:#fff;border-radius:999px;padding:7px 20px;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.timer.late span{background:#b91c1c}
.cert{background:#fff;max-width:960px;margin:0 auto;color:#1c1917}
.cert .frame{position:relative;overflow:hidden;border:2px solid #b45309;padding:44px 60px 40px;text-align:center;background:linear-gradient(160deg,#fffdf6 0%,#fdf6e3 55%,#fbf1d9 100%);print-color-adjust:exact;-webkit-print-color-adjust:exact}
.cert .frame::before{content:'';position:absolute;inset:7px;border:1.5px solid #d9c58a;pointer-events:none}
.cert .frame::after{content:'';position:absolute;inset:12px;border:1px solid #ecd9a8;pointer-events:none}
.cert .ccorner{position:absolute;width:64px;height:64px;color:#b45309;z-index:1}
.cert .ccorner.tl{top:4px;right:4px}
.cert .ccorner.tr{top:4px;left:4px;transform:scaleX(-1)}
.cert .ccorner.bl{bottom:4px;right:4px;transform:scaleY(-1)}
.cert .ccorner.br{bottom:4px;left:4px;transform:scale(-1)}
.cert .cwm{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);opacity:.045;color:#1e1b4b;pointer-events:none}
.cert .cbody{position:relative;z-index:2}
.cert .cbrand{display:flex;align-items:center;justify-content:center;gap:14px;font-size:14.5px;color:#92600a;font-weight:800;letter-spacing:.5px}
.cert .cbrand .cl{height:1.5px;width:70px;background:linear-gradient(90deg,transparent,#c9a227)}
.cert .cbrand .cr{height:1.5px;width:70px;background:linear-gradient(90deg,#c9a227,transparent)}
.cert h1{font-size:42px;color:#1e1b4b;margin:14px 0 2px;font-weight:900}
.cert .cdiv{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 14px}
.cert .cdiv span{height:1.5px;width:110px;background:linear-gradient(90deg,transparent,#b45309)}
.cert .cdiv span:last-child{background:linear-gradient(90deg,#b45309,transparent)}
.cert .cdiv svg{color:#b45309}
.cert .csub{font-size:15px;color:#57534e}
.cert .csub b{color:#1e1b4b}
.cert .cname{font-size:31px;font-weight:900;color:#92600a;margin:18px auto 10px;border-bottom:2px dashed #d9c58a;display:inline-block;padding:0 34px 10px}
.cert .creason{font-size:16.5px;color:#292524;line-height:2.15}
.cert .crow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;text-align:center;position:relative}
.cert .cstamp{margin-bottom:-8px}
.cert .sig{min-width:180px}
.cert .sig .slabel{font-size:12.5px;color:#78716c;margin-top:5px}
.cert .sig .sname{font-size:19px;font-weight:900;color:#1e1b4b;border-top:1.5px solid #a8a29e;padding-top:6px;display:inline-block;min-width:170px}
.cert .csig-space{height:64px;display:flex;align-items:flex-end;justify-content:center}
.cert .csig-img{max-height:64px;max-width:190px;object-fit:contain}
.cert .cseal{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:0}
.cert .cseal-c{position:absolute;left:-38px;bottom:0;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5d676,#c9a227 60%,#9a7414);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(120,80,10,.35),inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 0 6px rgba(122,85,8,.25)}
.cert .cseal-r{position:absolute;bottom:-16px;width:26px;height:44px;background:linear-gradient(180deg,#c9a227,#8a6508);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.cert .cseal-r.l{left:-30px;transform:rotate(14deg)}
.cert .cseal-r.r{left:6px;transform:rotate(-14deg)}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .appframe{display:none!important}
  .printdoc{padding:0;max-width:none}
  .cert{max-width:none}
  .cert .frame{box-shadow:none}
}
pre#testlog{direction:ltr;text-align:left;background:#0f172a;color:#a5f3fc;font-size:12px;padding:12px;border-radius:10px;white-space:pre-wrap}
</style>

<script>/* Pure helpers shared by the app and the unit tests (no DOM, no network). */
(function (root, factory) {
  const lib = factory();
  if (typeof module === 'object' && module.exports) module.exports = lib;
  else root.PLATFORM_LIB = lib;
})(typeof self !== 'undefined' ? self : this, function () {
  const AR_DIACRITICS = /[\u064B-\u0652\u0670\u06D6-\u06ED\u08F0-\u08FF]/g;

  // Normalize Arabic text for search/dedup: unify alef/ya/taa forms, strip
  // diacritics and tatweel, collapse whitespace, lowercase.
  function normAr(s) {
    return String(s || '')
      .replace(AR_DIACRITICS, '')
      .replace(/ـ/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  // Server-side name normalization (must mirror the SQL in register_student):
  // lower + trim + collapse spaces ONLY (no Arabic unification).
  function nameNormServer(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  }

  function csvEscape(v) {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function csvRow(arr) { return arr.map(csvEscape).join(','); }

  function pct(part, whole) {
    const w = Number(whole);
    if (!w || w <= 0) return null;
    return Math.round((Number(part) / w) * 1000) / 10;
  }

  function todayLocal(d) {
    const x = d ? new Date(d) : new Date();
    const p = (n) => String(n).padStart(2, '0');
    return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate());
  }

  const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function fmtDateAr(iso) {
    if (!iso) return '';
    const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso);
    if (isNaN(d)) return String(iso);
    return d.getDate() + ' ' + AR_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function validateName(n) {
    const s = String(n || '').trim();
    if (s.length < 3) return 'الاسم لازم يكون 3 حروف على الأقل';
    if (s.length > 100) return 'الاسم طويل جدًا';
    return null;
  }

  function validatePin(p) {
    const s = String(p || '');
    if (s.length < 4) return 'الرقم السري لازم يكون 4 أرقام على الأقل';
    if (s.length > 20) return 'الرقم السري طويل جدًا';
    return null;
  }

  function validateScore(score, max) {
    const n = Number(score);
    if (score === '' || score == null || isNaN(n)) return 'اكتب درجة صحيحة';
    if (n < 0) return 'الدرجة لا تصلح سالبة';
    if (Number(max) > 0 && n > Number(max)) return 'الدرجة أكبر من الدرجة العظمى (' + max + ')';
    return null;
  }

  function fmtBytes(b) {
    const n = Number(b) || 0;
    if (n < 1024) return n + ' بايت';
    if (n < 1024 * 1024) return (Math.round(n / 102.4) / 10) + ' ك.ب';
    return (Math.round(n / 104857.6) / 10) + ' م.ب';
  }

  function statusAr(s) {
    return s === 'present' ? 'حاضر' : s === 'late' ? 'متأخر' : s === 'absent' ? 'غائب' : s;
  }

  return { normAr, nameNormServer, csvEscape, csvRow, pct, todayLocal, fmtDateAr,
           validateName, validatePin, validateScore, fmtBytes, statusAr };
});
</script>

function footHTML(){
  return `<div class="foot"><div class="fline"></div>
    إعداد وتطوير <b>${esc(S.brand.name)}</b><br>${esc(brandLine())} · ${esc(S.brand.grade)}

/* ================= tiny framework ================= */
const root = document.getElementById('root');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg, isErr){
  const t=document.createElement('div');t.className='toast'+(isErr?' err':'');t.textContent=msg;
  document.getElementById('toastbox').appendChild(t);
  setTimeout(()=>t.remove(), isErr?4200:2600);
}
function errMsg(e){
  if(!e) return 'حصل خطأ غير متوقع';
  const m=(e.message||e.error_description||String(e));
  if(/Failed to fetch|NetworkError|network/i.test(m)) return 'مشكلة في الاتصال بالإنترنت، جرّب تاني';
  return m;
}
async function api(p){ // wrapped query helper with error throw
  const {data,error} = await p;
  if(error) throw error;
  return data;
}
async function loadGroups(){
  try{
    const rows = await api(sb.from('settings').select('value').eq('key','groups'));
    if(rows && rows[0] && Array.isArray(rows[0].value)) S.groups = rows[0].value;
  }catch(e){ /* keep defaults */ }
  if(!S.groups.length) S.groups = ['أ','ب','ج'];
}

/* ================= boot ================= */
async function boot(){
  root.innerHTML = '<div class="wrap center" style="padding-top:80px"><div class="spin" style="border-color:var(--pri);border-top-color:transparent"></div><p class="mut mt">جاري التحميل...</p></div>';
  try{
    const {data:{session}} = await sb.auth.getSession();
    S.session = session;
    await Promise.all([loadGroups(), loadBranding()]);
    if(!session){ viewLanding(); return; }
    if(session.user.email === CFG.teacherEmail){ S.role='teacher'; viewTeacher('home'); return; }
    // anonymous / student session
    const rows = await api(sb.from('students').select('*'));
    if(rows && rows[0]){ S.role='student'; S.profile=rows[0]; viewStudent('home'); }
    else viewStudentAuth('register'); // session exists but no profile yet
  }catch(e){
    root.innerHTML = '<div class="wrap center" style="padding-top:80px"><p style="font-size:34px;color:var(--warn)">'+ic('alert',40)+'</p><p class="mt">'+esc(errMsg(e))+'</p><button class="btn mt" onclick="boot()">إعادة المحاولة</button></div>';
  }
}
async function signOut(){
  await sb.auth.signOut();
  S = {session:null, role:null, profile:null, groups:S.groups, tab:'', brand:S.brand, tstyle:S.tstyle};
  viewLanding();
}

/* ================= landing ================= */

  root.innerHTML = `
  ${heroHTML(S.brand.grade)}
  <div class="wrap mt">
    <button class="rolecard" onclick="viewStudentAuth('register')">
      <span class="ric st">${ic('cap',28)}</span>
      <span><h3>أنا طالب</h3><p>سجّل بياناتك بنفسك، تابع حضورك ودرجاتك وترتيبك، وحمل الملفات والصور اللي بينزلها المدرس.</p></span>
      <span class="go">${ic('back',22)}</span>
    </button>
    <button class="rolecard" onclick="viewTeacherLogin()">
      <span class="ric te">${ic('users',28)}</span>
      <span><h3>أنا المدرس</h3><p>لوحة تحكم متكاملة: الطلاب والحضور والدرجات والملفات والإعلانات والتقارير.</p></span>
      <span class="go">${ic('back',22)}</span>
    </button>
    <div class="feats mt">
      <div class="feat"><span class="fic" style="background:#ccfbf1;color:#0f766e">${ic('user',20)}</span><span><b>تسجيل ذاتي</b><span>كل طالب يسجل بنفسه</span></span></div>

/* ================= student auth ================= */

  ${heroHTML(isReg?'تسجيل طالب جديد':'دخول الطالب', true)}
  <div class="wrap mt">
    <div class="tabs">
      <button class="tab ${isReg?'on':''}" onclick="viewStudentAuth('register')">${ic('plus',16)} تسجيل جديد</button>

    </div>
    <div class="card">
      ${isReg?`
      <div class="field"><label>الاسم بالكامل</label><input id="f-name" placeholder="مثال: أحمد محمد علي" autocomplete="name"></div>

      <div class="field"><label>رقم سري (4 أرقام أو أكثر)</label><input id="f-pin" type="password" inputmode="numeric" placeholder="تحفظه عندك وتدخل به من أي جهاز">

      <div class="field"><label>تأكيد الرقم السري</label><input id="f-pin2" type="password" inputmode="numeric"></div>
      <button class="btn" id="btn-reg" onclick="doRegister()">${ic('check',18)} إنشاء الحساب</button>
      `:`
      <div class="field"><label>الاسم بالكامل (زي ما سجلت بالظبط)</label><input id="f-name"></div>
      <div class="field"><label>الرقم السري</label><input id="f-pin" type="password" inputmode="numeric"></div>
      <button class="btn" id="btn-login" onclick="doStudentLogin()">${ic('user',18)} دخول</button>

const PDFJS_V='3.11.174';
function loadPdfJs(){
  return new Promise((res,rej)=>{
    if(window.pdfjsLib) return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_V+'/build/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_V+'/build/pdf.worker.min.js';res();};
    s.onerror=()=>rej(new Error('pdfjs'));
    document.head.appendChild(s);
  });
}
async function openPdf(url,title){
  document.getElementById('viewer-title').textContent=title||'';
  document.getElementById('viewer-ext').href=url;
  document.getElementById('viewer-ifr').style.display='none';
  const box=document.getElementById('viewer-pdf');
  box.style.display='block';
  box.innerHTML='<div style="color:#fff;padding:40px"><span class="spin"></span><p style="margin-top:12px">جاري تحميل الملف...</p></div>';
  document.getElementById('viewer').style.display='flex';
  document.body.style.overflow='hidden';
  try{
    await loadPdfJs();
    const pdf=await window.pdfjsLib.getDocument(url).promise;
    box.innerHTML='';
    const w=Math.min(box.clientWidth-16,900);
    for(let n=1;n<=pdf.numPages;n++){
      if(document.getElementById('viewer').style.display==='none') return;
      const page=await pdf.getPage(n);
      const base=page.getViewport({scale:1});
      const vp=page.getViewport({scale:w/base.width});
      const dpr=Math.min(window.devicePixelRatio||1,2);
      const c=document.createElement('canvas');
      c.width=Math.floor(vp.width*dpr); c.height=Math.floor(vp.height*dpr);
      c.style.cssText='width:'+Math.floor(vp.width)+'px;height:'+Math.floor(vp.height)+'px;background:#fff;display:block;margin:0 auto 10px;box-shadow:0 2px 8px rgba(0,0,0,.4)';
      box.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
    }
  }catch(e){
    box.innerHTML='<div style="color:#fff;padding:40px">مقدرناش نعرض الملف هنا، افتحه في تبويب جديد أو حمله.<br><br><a class="btn sm" style="background:#fff;color:#131c33" href="'+esc(url)+'" target="_blank" rel="noopener">فتح الملف</a></div>';
  }
}

function fmtCode(src){
  const lines=String(src||'').replace(/\r\n?/g,'\n').split('\n').map(l=>l.replace(/[ \t]+$/,''));
  const out=[];let lvl=0,blank=0;
  for(const l of lines){
    const t=l.trim();
    if(!t){blank++;if(blank<=1&&out.length)out.push('');continue;}
    blank=0;
    const leadClose=/^[}\])]/.test(t)?1:0;
    lvl=Math.max(0,lvl-leadClose);
    out.push('  '.repeat(lvl)+t);
    const opens=(t.match(/[{([]/g)||[]).length, closes=(t.match(/[})\]]/g)||[]).length;
    lvl=Math.max(0,lvl+opens-closes+leadClose);
  }
  return out.join('\n').replace(/^\n+/,'').replace(/\n+$/,'')+'\n';
}

function toolNum(){
  const raw=v('tool-num-in').trim();
  if(!/^-?\d+$/.test(raw)) return toast('اكتب رقم صحيح',true);
  const n=parseInt(raw,10);
  if(!Number.isSafeInteger(n)) return toast('الرقم كبير أوي',true);
  const o=document.getElementById('tool-num-out');
  o.style.display='block';
  o.textContent='Decimal : '+n+'\nBinary  : '+(n<0?'-':'')+Math.abs(n).toString(2)+'\nOctal   : '+(n<0?'-':'')+Math.abs(n).toString(8)+'\nHex     : '+(n<0?'-':'')+Math.abs(n).toString(16).toUpperCase();
}

function arN(n,one,two,few,many){n=Number(n)||0;return n===1?one:n===2?two:(n>=3&&n<=10)?few:many;}

}
let examState=null;
async function sExamTake(id){
  try{
    const [ex,qs]=await Promise.all([
      api(sb.from('exams').select('*').eq('id',id)),
      api(sb.rpc('get_exam_questions',{p_exam_id:id})),
    ]);
    const exam=ex&&ex[0]; if(!exam) return toast('الاختبار غير موجود',true);
    if(!qs||!qs.length) return toast('مفيش أسئلة في الاختبار ده لسه',true);
    examState={exam,qs,answers:{},endAt:Date.now()+(exam.duration_minutes||10)*60000,timer:null};
    const body=document.getElementById('sbody');
    body.innerHTML=`<div class="timer" id="ex-timer"><span>...</span></div>
    <div class="card"><div class="sec-title"><span class="tic">${ic('book',17)}</span><h3>${esc(exam.title)}</h3></div>
    ${exam.description?`<p class="mut">${esc(exam.description)}</p>`:''}
    ${qs.map((q,i)=>{const pts=q.points||1;const opts=q.qtype==='tf'?['صح','خطأ']:(q.options||[]);
      return `<div style="margin-bottom:16px"><p style="margin-bottom:4px"><b>س${i+1}:</b> ${esc(q.question)} <span class="hint">(${pts} ${arN(pts,'درجة','درجتين','درجات','درجة')})</span></p>
      ${q.qtype==='fill'
        ?`<div class="field"><input id="fill-${q.id}" placeholder="اكتب إجابتك هنا" oninput="examFill('${q.id}',this.value)" style="border:1.5px solid var(--line);border-radius:12px;padding:11px;background:#fbfcff"></div>`
        :opts.map((o,oi)=>`<label class="opt" id="opt-${q.id}-${oi}" onclick="examPick('${q.id}',${oi})"><input type="radio" name="q-${q.id}"> ${esc(o)}</label>`).join('')}
    </div>`}).join('')}
    <button class="btn" onclick="examSubmit(false)">${ic('check',18)} تسليم الإجابات</button>
    <p class="hint center mt">بالتسليم مش هتقدر تعدّل إجاباتك أو تعيد الاختبار.</p>
    </div>`;
    examTick(); examState.timer=setInterval(examTick,1000);
  }catch(e){toast(errMsg(e),true);}
}
function examTick(){
  if(!examState) return;
  const left=Math.max(0,Math.round((examState.endAt-Date.now())/1000));
  const m=Math.floor(left/60), s=left%60;
  const el=document.getElementById('ex-timer');
  if(el){el.innerHTML=`<span>${ic('clock',14)} باقي ${m}:${String(s).padStart(2,'0')}</span>`; el.classList.toggle('late',left<=60);}
  if(left<=0){examSubmit(true);}
}
function examFill(qid,val){ if(!examState) return; examState.answers[qid]=val; }
function examPick(qid,oi){
  if(!examState) return;
  examState.answers[qid]=oi;
  const q=examState.qs.find(x=>x.id===qid);
  const nOpts=q.qtype==='tf'?2:(q.options||[]).length;
  for(let i=0;i<nOpts;i++){const el=document.getElementById('opt-'+qid+'-'+i); if(el) el.classList.toggle('sel',i===oi);}
  const radios=document.getElementsByName('q-'+qid); if(radios&&radios[oi]) radios[oi].checked=true;
}
async function examSubmit(auto){
  if(!examState) return;
  const st=examState; examState=null; clearInterval(st.timer);
  try{
    const r=await api(sb.rpc('submit_exam',{p_exam_id:st.exam.id,p_answers:st.answers}));
    if(r&&r.error==='already'){toast('سلّمت الاختبار ده قبل كده',true); return viewStudent('exams');}
    if(r&&r.error) throw new Error(r.error);
    const pc=r.total>0?Math.round(r.score/r.total*100):0;
    const msg=pc>=85?'ممتاز! نتيجة تفخر بيها':pc>=50?'كويس! راجع أخطاءك وحاول تتحسن':'محتاج تراجع الدرس كويس، ومتقلقش';
    const body=document.getElementById('sbody');
    body.innerHTML=`<div class="card center" style="padding:36px">
      <div style="display:flex;justify-content:center">${donutSVG(pc, pc>=85?'#15803d':pc>=50?'#b45309':'#b91c1c')}</div>
      <h2 style="margin:10px 0 4px">${r.score} / ${r.total}</h2>
      <p class="mut">${auto?'انتهى الوقت واتسلّمت إجاباتك تلقائيًا. ':''}${msg}</p>
      <button class="btn mt" onclick="viewStudent('exams')">${ic('back',15)} رجوع للاختبارات</button>
    </div>`;
  }catch(e){toast(errMsg(e),true); viewStudent('exams');}
}

/* ---- teacher: attendance ---- */
let attDate='',attCache=[],attMarks={};
async function tAtt(body,date){
  attDate=date||attDate||L.todayLocal();
  const [students,recs]=await Promise.all([
    api(sb.from('students').select('id,name,group_name').order('name')),
    api(sb.from('attendance').select('*').eq('day',attDate)),
  ]);
  attCache=students||[]; attMarks={};
  (recs||[]).forEach(r=>attMarks[r.student_id]=r.status);
  const days=await api(sb.from('attendance').select('day').order('day',{ascending:false}).limit(500));
  const uniqDays=[...new Set((days||[]).map(d=>d.day))].slice(0,14);
  body.innerHTML=`
  <div class="card">
    <div class="sec-title"><span class="tic">${ic('att',17)}</span><h3>تسجيل الحضور</h3></div>
    <div class="row mb"><input type="date" class="grow" id="att-date" value="${attDate}" style="border:1.5px solid var(--line);border-radius:12px;padding:11px;background:#fbfcff" onchange="tAtt(document.getElementById('tbody'),this.value)">
    <button class="btn sm" onclick="tSaveAtt()">${ic('check',16)} حفظ</button></div>
    <div class="chips" id="att-groups"></div>
    <div id="att-list"></div>
  </div>
  <div class="card"><div class="sec-title"><span class="tic">${ic('cal',17)}</span><h3>أيام سابقة</h3></div>
    <div class="chips">${uniqDays.map(d=>`<button class="chip ${d===attDate?'on':''}" onclick="tAtt(document.getElementById('tbody'),'${d}')">${L.fmtDateAr(d)}</button>`).join('')||'<span class="mut">لا يوجد</span>'}</div>
  </div>`;
  renderAttGroups(); renderAttList();
}
let attGroup='';
function renderAttGroups(){
  const gs=[...new Set(attCache.map(s=>s.group_name).filter(Boolean))];
  document.getElementById('att-groups').innerHTML=
    `<button class="chip ${attGroup===''?'on':''}" onclick="attGroup='';renderAttGroups();renderAttList()">الكل</button>`+
    gs.map(g=>`<button class="chip ${attGroup===g?'on':''}" onclick="attGroup='${esc(g)}';renderAttGroups();renderAttList()">${esc(g)}</button>`).join('');
}
function renderAttList(){
  const list=attCache.filter(s=>!attGroup||s.group_name===attGroup);
  document.getElementById('att-list').innerHTML=list.length?list.map(s=>{
    const m=attMarks[s.id]||'';
    return `<div class="frow">
      <div class="grow" style="font-weight:700">${esc(s.name)}</div>
      <div class="seg" style="width:210px">
        <button class="p ${m==='present'?'on':''}" onclick="attMarks['${s.id}']='present';renderAttList()">حاضر</button>
        <button class="l ${m==='late'?'on':''}" onclick="attMarks['${s.id}']='late';renderAttList()">متأخر</button>
        <button class="a ${m==='absent'?'on':''}" onclick="attMarks['${s.id}']='absent';renderAttList()">غائب</button>
      </div>
    </div>`;
  }).join(''):'<div class="empty"><span class="eic">'+ic('users',24)+'</span>مفيش طلاب لسه</div>';
}
async function tSaveAtt(){
  const rows=Object.entries(attMarks).filter(([,st])=>st).map(([student_id,status])=>({student_id,day:attDate,status}));
  if(!rows.length) return toast('علّم على حالة طالب واحد على الأقل',true);
  try{
    await api(sb.from('attendance').upsert(rows,{onConflict:'student_id,day'}));
    toast('اتحفظ حضور '+rows.length+' طالب');
  }catch(e){toast(errMsg(e),true);}
}

  </div>`;

async function tExamDelete(id,title){

}

    <span class="badge ${exam.published?'g':'y'}">${exam.published?'منشور':'مسودة'}</span></div>

  </div>
  <div class="card"><div class="sec-title"><span class="tic">${ic('plus',17)}</span><h3>إضافة سؤال</h3></div>
    <div class="field"><label>نوع السؤال</label><select id="q-type" onchange="tQTypeUI()">

function tQTypeUI(){
  const t=(document.getElementById('q-type')||{}).value||'mcq';
  document.getElementById('q-opts-mcq').style.display=t==='mcq'?'':'none';
  document.getElementById('q-opts-tf').style.display=t==='tf'?'':'none';
  document.getElementById('q-opts-fill').style.display=t==='fill'?'':'none';
  document.getElementById('q-hint').textContent=t==='mcq'?'علّم الدائرة جنب الإجابة الصحيحة قبل الحفظ.':t==='tf'?'اختار الإجابة الصحيحة: صح ولا خطأ.':'اكتب كل الصيغ الصحيحة المقبولة للإجابة.';
}
function normAns(t){return String(t||'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase().replace(/\s+/g,' ').trim();}
async function tQuestionAdd(examId){
  const question=v('q-text').trim(); if(!question) return toast('اكتب نص السؤال',true);
  const qtype=(document.getElementById('q-type')||{}).value||'mcq';
  const row={exam_id:examId,question,qtype,points:Number(v('q-points'))||1};
  if(qtype==='mcq'){
    const options=[0,1,2,3].map(i=>v('q-opt-'+i).trim());
    if(options.some(o=>!o)) return toast('اكتب الاختيارات الأربعة',true);
    let correct=-1; for(let i=0;i<4;i++){const r=document.getElementById('q-correct-'+i); if(r&&r.checked) correct=i;}
    if(correct<0) return toast('علّم الإجابة الصحيحة جنب الاختيار الصح',true);
    row.options=options; row.correct_index=correct;
  }else if(qtype==='tf'){
    let correct=-1; for(let i=0;i<2;i++){const r=document.getElementById('q-tf-'+i); if(r&&r.checked) correct=i;}
    if(correct<0) return toast('اختار الإجابة الصحيحة: صح ولا خطأ',true);
    row.options=['صح','خطأ']; row.correct_index=correct;
  }else{
    const answers=v('q-answers').split(/[,،]/).map(x=>x.trim()).filter(Boolean);
    if(!answers.length) return toast('اكتب إجابة صحيحة واحدة على الأقل',true);
    row.correct_answers=answers;
  }
  try{
    const cnt=await api(sb.from('exam_questions').select('id').eq('exam_id',examId));
    row.ord=(cnt||[]).length;
    await api(sb.from('exam_questions').insert(row));
    toast('اتضاف السؤال'); tExamEdit(examId);
  }catch(e){toast(errMsg(e),true);}
}
async function tQuestionDelete(qid,examId){
  if(!confirm('حذف السؤال ده؟')) return;
  try{await api(sb.from('exam_questions').delete().eq('id',qid)); toast('اتحذف السؤال'); tExamEdit(examId);}catch(e){toast(errMsg(e),true);}
}

/* ---- teacher: certificates ---- */
let certStudent=null;
async function tCert(id){
  try{
    const [stu,att,asm,scores]=await Promise.all([
      api(sb.from('students').select('*').eq('id',id)),
      api(sb.from('attendance').select('status').eq('student_id',id)),
      api(sb.from('assessments').select('id,max_score')),
      api(sb.from('scores').select('*').eq('student_id',id)),
    ]);
    const s=stu&&stu[0]; if(!s) throw new Error('الطالب غير موجود');
    const c={present:0,late:0,absent:0};(att||[]).forEach(a=>c[a.status]++);
    const total=c.present+c.late+c.absent; const ap=total?Math.round((c.present+c.late*0.5)/total*100):null;
    const maxOf={};(asm||[]).forEach(a=>maxOf[a.id]=Number(a.max_score));
    let tp=0,tm=0;(scores||[]).forEach(x=>{tp+=Number(x.score);tm+=maxOf[x.assessment_id]||0;});

let gm={asms:[],students:[],scores:{},cur:null};
async function tGrades(body){
  const [asms,students,scores]=await Promise.all([
    api(sb.from('assessments').select('*').order('day',{ascending:false})),
    api(sb.from('students').select('id,name,group_name').order('name')),
    api(sb.from('scores').select('*')),
  ]);
  gm.asms=asms||[]; gm.students=students||[]; gm.scores={};
  (scores||[]).forEach(s=>gm.scores[s.assessment_id+'_'+s.student_id]=s.score);
  gm.cur = gm.cur && gm.asms.find(a=>a.id===gm.cur) ? gm.cur : (gm.asms[0]&&gm.asms[0].id)||null;
  body.innerHTML=`
  <div class="card">
    <div class="sec-title"><span class="tic">${ic('plus',17)}</span><h3>التقييمات</h3></div>
    <div class="row mb">
      <input class="grow" id="asm-title" placeholder="اسم التقييم (مثال: كويز HTML)" style="border:1.5px solid var(--line);border-radius:12px;padding:11px;background:#fbfcff">
      <input id="asm-max" type="number" min="1" placeholder="العظمى" style="width:90px;border:1.5px solid var(--line);border-radius:12px;padding:11px;background:#fbfcff">
      <button class="btn sm" onclick="tAddAsm()">${ic('plus',16)} إضافة</button>
    </div>
    <div class="chips" id="asm-chips"></div>
  </div>
  <div class="card" id="asm-body"></div>
  <div class="card" id="rank-body"></div>`;
  renderAsmChips(); renderAsmBody(); renderRank();
}
function renderAsmChips(){
  document.getElementById('asm-chips').innerHTML = gm.asms.length? gm.asms.map(a=>
    `<button class="chip ${gm.cur===a.id?'on':''}" onclick="gm.cur=${a.id};renderAsmChips();renderAsmBody()">${esc(a.title)} (${a.max_score})</button>`).join('')
    : '<span class="mut">مفيش تقييمات — أضف أول واحد فوق</span>';
}
async function tAddAsm(){
  const title=v('asm-title').trim(), max=Number(v('asm-max'));
  if(!title) return toast('اكتب اسم التقييم',true);
  if(!max||max<=0) return toast('اكتب الدرجة العظمى',true);
  try{
    const rows=await api(sb.from('assessments').insert({title,max_score:max}).select());
    toast('اتضاف التقييم');
    gm.cur=rows[0].id; tGrades(document.getElementById('tbody'));
  }catch(e){toast(errMsg(e),true);}
}
async function tDelAsm(id,title){
  if(!confirm('حذف التقييم "'+title+'" ودرجاته؟')) return;
  try{ await api(sb.from('assessments').delete().eq('id',id)); gm.cur=null; toast('اتحذف'); tGrades(document.getElementById('tbody')); }
  catch(e){toast(errMsg(e),true);}
}
function renderAsmBody(){
  const el=document.getElementById('asm-body');
  const a=gm.asms.find(x=>x.id===gm.cur);
  if(!a){el.innerHTML='<div class="empty"><span class="eic">'+ic('chart',24)+'</span>اختار تقييم لرصد الدرجات</div>';return;}
  el.innerHTML=`
  <div class="hdr mb"><h3>رصد: ${esc(a.title)} (من ${a.max_score})</h3>
    <div class="row">
      <button class="btn sm dan" onclick="tDelAsm(${a.id},'${esc(a.title)}')">${ic('trash',15)} حذف</button>
      <button class="btn sm" onclick="tSaveScores()">${ic('check',16)} حفظ الدرجات</button>
    </div></div>
  ${gm.students.length? gm.students.map(s=>{
    const val=gm.scores[a.id+'_'+s.id];
    return `<div class="frow">
      <div class="grow">${esc(s.name)}<div class="hint">${esc(s.group_name||'')}</div></div>
      <input type="number" min="0" max="${a.max_score}" step="0.5" data-sid="${s.id}" class="score-in" value="${val==null?'':val}" placeholder="—" style="width:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fbfcff">
    </div>`;
  }).join(''):'<div class="empty"><span class="eic">'+ic('users',24)+'</span>مفيش طلاب لسه</div>'}`;
}
async function tSaveScores(){
  const a=gm.asms.find(x=>x.id===gm.cur); if(!a) return;
  const rows=[]; let bad=null;
  document.querySelectorAll('.score-in').forEach(inp=>{
    const raw=inp.value.trim(); if(raw==='') return;
    const err=L.validateScore(raw,a.max_score); if(err){bad=err;return;}
    rows.push({assessment_id:a.id,student_id:inp.dataset.sid,score:Number(raw)});
  });
  if(bad) return toast(bad,true);
  if(!rows.length) return toast('اكتب درجة واحدة على الأقل',true);
  try{
    await api(sb.from('scores').upsert(rows,{onConflict:'assessment_id,student_id'}));
    toast('اتحفظت '+rows.length+' درجة');
    tGrades(document.getElementById('tbody'));
  }catch(e){toast(errMsg(e),true);}
}
function renderRank(){
  const el=document.getElementById('rank-body');
  if(!gm.asms.length||!gm.students.length){el.innerHTML='';return;}
  const rows=gm.students.map(s=>{
    let tp=0,tm=0;
    gm.asms.forEach(a=>{const v=gm.scores[a.id+'_'+s.id]; if(v!=null){tp+=Number(v);tm+=Number(a.max_score);}});
    return {name:s.name,group:s.group_name,tp,tm,pct:tm?L.pct(tp,tm):null};
  }).filter(r=>r.tm>0).sort((x,y)=>y.pct-x.pct);
  const hi=rows.filter(r=>r.pct>=85).length, mid=rows.filter(r=>r.pct>=50&&r.pct<85).length, lo=rows.filter(r=>r.pct<50).length;
  const medalColor=['#d97706','#64748b','#b45309'];
  el.innerHTML=(rows.length?`
  <div class="sec-title"><span class="tic">${ic('medal',17)}</span><h3>الترتيب العام</h3></div>
  <div class="grid3 mb">
    <div class="stat"><div class="big" style="color:var(--ok)">${hi}</div><div class="lbl">ممتاز (85%+)</div></div>
    <div class="stat"><div class="big" style="color:var(--warn)">${mid}</div><div class="lbl">متوسط</div></div>
    <div class="stat"><div class="big" style="color:var(--dan)">${lo}</div><div class="lbl">يحتاج دعم</div></div>
  </div>
  <table><tr><th>#</th><th>الطالب</th><th>المجموع</th><th>%</th></tr>
    ${rows.map((r,i)=>`<tr>
      <td>${i<3?`<span style="color:${medalColor[i]}">${ic('medal',20)}</span>`:i+1}</td>
      <td>${esc(r.name)}</td><td>${r.tp} / ${r.tm}</td>
      <td><span class="badge ${r.pct>=85?'g':r.pct>=50?'y':'r'}">${r.pct}%</span></td></tr>`).join('')}</table>`
  :'<div class="empty"><span class="eic">'+ic('chart',24)+'</span>لسه مفيش درجات</div>');
}

function tUpMode(m){
  document.getElementById('upf-file').style.display=m==='file'?'block':'none';

  document.getElementById('upm-file').classList.toggle('on',m==='file');

function ytId(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
async function tAddYoutube(){
  const title=v('yt-title').trim(), url=v('yt-url').trim(), desc=v('yt-desc').trim();
  if(!title) return toast('اكتب عنوان للفيديو',true);
  const id=ytId(url);
  if(!id) return toast('اللينك مش صحيح — انسخ لينك الفيديو من يوتيوب',true);
  try{
    await api(sb.from('files_meta').insert({title,description:desc,path:'',url:'https://www.youtube.com/watch?v='+id,kind:'youtube',size_bytes:0}));
    toast('اتضاف الفيديو "'+title+'"');
    viewTeacher('files');
  }catch(e){toast(errMsg(e),true);}
}
async function tUpload(){
  const fi=document.getElementById('up-file');
  const file=fi.files&&fi.files[0];
  const title=v('up-title').trim(), desc=v('up-desc').trim();
  if(!file) return toast('اختار ملف الأول',true);
  if(!title) return toast('اكتب عنوان للملف',true);
  if(file.size>20*1024*1024) return toast('الملف أكبر من 20 ميجا',true);
  const b=document.getElementById('btn-up'); b.disabled=true;
  const prog=document.getElementById('up-prog'); prog.style.display='block';
  try{
    const isImg=file.type.startsWith('image/');
    const safe=file.name.replace(/[^A-Za-z0-9.\-_]/g,'_').slice(-60);
    const path=Date.now()+'-'+safe;
    const {error:upErr}=await sb.storage.from('files').upload(path,file,{contentType:file.type||'application/octet-stream'});
    if(upErr) throw upErr;
    const {data:{publicUrl}}=sb.storage.from('files').getPublicUrl(path);
    await api(sb.from('files_meta').insert({title,description:desc,path,url:publicUrl,kind:isImg?'image':'file',size_bytes:file.size}));
    toast('اتنشر "'+title+'"');
    viewTeacher('files');
  }catch(e){toast(errMsg(e),true);}
  b.disabled=false; prog.style.display='none';
}
async function tDelFile(id,path,kind){
  if(!confirm(kind==='youtube'?'حذف الفيديو ده من المنصة؟':'حذف الملف ده؟')) return;
  try{
    if(kind!=='youtube') await sb.storage.from('files').remove([path]);
    await api(sb.from('files_meta').delete().eq('id',id));
    toast('اتحذف'); viewTeacher('files');
  }catch(e){toast(errMsg(e),true);}
}

const TS_COLORS=[['gold','دهبي'],['#ffffff','أبيض'],['#7dd3fc','سماوي'],['#86efac','نعناعي'],['#fda4af','وردي']];
let tsCur={font:'lalezar',size:1.2,color:'gold',bold:true,align:'center'};
function tStyleInit(){
  tsCur=Object.assign({},tsCur,S.tstyle||{});
  document.getElementById('ts-font').value=tsCur.font;
  document.getElementById('ts-size').value=tsCur.size;
  document.getElementById('ts-align').value=tsCur.align;
  document.getElementById('ts-bold').checked=!!tsCur.bold;
  const row=document.getElementById('ts-colors');
  row.innerHTML=TS_COLORS.map(c=>'<span class="swatch'+(tsCur.color===c[0]?' on':'')+'" title="'+c[1]+'" data-c="'+c[0]+'" style="background:'+(c[0]==='gold'?'linear-gradient(180deg,#f6d365,#d97706)':c[0])+'" onclick="tStylePick(this)"></span>').join('');
  tStylePreview();
}
function tStylePick(el){
  document.querySelectorAll('#ts-colors .swatch').forEach(s=>s.classList.remove('on'));
  el.classList.add('on'); tStylePreview();
}
function tStylePreview(){
  const on=document.querySelector('#ts-colors .swatch.on');
  tsCur={font:document.getElementById('ts-font').value,
    size:Number(document.getElementById('ts-size').value)||1,
    color:on?on.getAttribute('data-c'):'gold',
    bold:document.getElementById('ts-bold').checked,
    align:document.getElementById('ts-align').value};
  const thu=tsCur.font!=='normal';
  const fam=titleFam(tsCur.font);
  const t1=document.getElementById('tsp-1'),t2=document.getElementById('tsp-2');
  [t1,t2].forEach(el=>{
    el.style.fontFamily=fam;
    el.style.textAlign=tsCur.align;
    el.style.fontWeight=tsCur.font==='lalezar'?'400':(tsCur.bold&&!thu?'900':'800');
    if(tsCur.color==='gold'){el.classList.add('goldtext');el.style.color='';}
    else{el.classList.remove('goldtext');el.style.color=tsCur.color;}
  });
  t1.style.fontSize=Math.round(40*tsCur.size)+'px';
  t2.style.fontSize=Math.round(24*tsCur.size)+'px';
}
async function tSaveStyle(){
  try{

    if(error) throw error;
    toast('اتغيرت كلمة السر');
  }catch(e){toast(errMsg(e),true);}
}
function download(name,content,mime){
  const blob=new Blob([content],{type:mime||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
async function tBackup(){
  try{
    const [students,att,asm,scores,files,ann,settings]=await Promise.all([
      api(sb.from('students').select('*')),api(sb.from('attendance').select('*')),
      api(sb.from('assessments').select('*')),api(sb.from('scores').select('*')),
      api(sb.from('files_meta').select('*')),api(sb.from('announcements').select('*')),
      api(sb.from('settings').select('*')),
    ]);
    const payload={exported_at:new Date().toISOString(),platform:'asoom-students',students,attendance:att,assessments:asm,scores,files_meta:files,announcements:ann,settings};
    download('نسخة-احتياطية-'+L.todayLocal()+'.json',JSON.stringify(payload,null,1),'application/json');
    toast('اتحملت النسخة الاحتياطية');
  }catch(e){toast(errMsg(e),true);}
}
async function tCsv(){
  try{
    const [students,asm,scores]=await Promise.all([
      api(sb.from('students').select('*').order('name')),
      api(sb.from('assessments').select('*').order('day')),
      api(sb.from('scores').select('*')),
    ]);
    const sc={};(scores||[]).forEach(s=>sc[s.assessment_id+'_'+s.student_id]=s.score);
    const head=['الاسم','الشعبة','الموبايل'].concat((asm||[]).map(a=>a.title+' (من '+a.max_score+')'));
    const lines=[L.csvRow(head)];
    (students||[]).forEach(s=>{
      lines.push(L.csvRow([s.name,s.group_name,s.phone].concat((asm||[]).map(a=>{const x=sc[a.id+'_'+s.id];return x==null?'':x;}))));
    });
    download('الطلاب-والدرجات-'+L.todayLocal()+'.csv','﻿'+lines.join('\r\n'),'text/csv');
    toast('اتحمل ملف الإكسل');
  }catch(e){toast(errMsg(e),true);}
}
